<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 250px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f9f9f9;
      color: #333;
      text-align: center;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
    }
    .header img {
      width: 32px;
      height: 32px;
      margin-right: 10px;
    }
    h2 {
      font-size: 16px;
      margin: 0;
      color: #1a73e8;
    }
    p {
      font-size: 13px;
      color: #555;
    }
    .status {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 15px;
      background-color: #e6f4ea;
      color: #1e8e3e;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icon.png" alt="Icon">
    <h2>Canvas Blocker</h2>
  </div>
  <p>Your canvas fingerprint is protected with random noise.</p>
  <div class="status">Active & Protecting</div>
</body>
</html>
